plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def buildNumber = (project.findProperty('appBuildNumber') ?: '1').toString().toInteger()
def signingFile = System.getenv('BODYTRACE_SIGNING_FILE')
def signingStorePass = System.getenv('BODYTRACE_STORE_PASSWORD')
def signingAlias = System.getenv('BODYTRACE_KEY_ALIAS')
def signingKeyPass = System.getenv('BODYTRACE_KEY_PASSWORD')
def signingReady = signingFile && file(signingFile).exists() &&
        signingStorePass && signingAlias && signingKeyPass

android {
    namespace 'com.z2846852.bodytrace'
    compileSdk 35
    defaultConfig {
        applicationId 'com.z2846852.bodytrace'
        minSdk 26
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }
        versionCode buildNumber
        versionName "0.2." + buildNumber
    }
    signingConfigs {
        stableRelease {
            if (signingReady) {
                storeFile file(signingFile)
                storePassword signingStorePass
                keyAlias signingAlias
                keyPassword signingKeyPass
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (signingReady) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }
    androidResources { noCompress += 'tflite' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stable TensorFlow Lite Java interpreter for the pinned offline YAMNet model.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    // Official sherpa-onnx Android AAR, pinned SHA256, downloaded at build time.
    // Contains the runtime JNI only. ZIPA weights are never included in this APK.
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
}
