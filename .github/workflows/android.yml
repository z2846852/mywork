name: Build BodyTrace Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/test_ui.js'
      - 'app/src/main/assets/avatar_cartoon.svg'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bodytrace-android-main
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cartoon body page, JSON UI and avatar persistence
        run: node scripts/test_ui.js
      - name: Fetch and SHA256-verify offline YAMNet model
        run: bash scripts/fetch_yamnet.sh
      - name: Inspect bundled YAMNet TFLite tensor shapes
        run: python3 scripts/inspect_yamnet.py
      - name: Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load fixed public signing identity
        shell: bash
        run: |
          set -euo pipefail
          signing_file="$RUNNER_TEMP/bodytrace-release.p12"
          test -s signing/bodytrace-release.p12.b64
          base64 --decode signing/bodytrace-release.p12.b64 > "$signing_file"
          keytool -list -storetype PKCS12 -keystore "$signing_file" \
            -storepass "bodytrace-public-signing-v1" -alias bodytrace >/dev/null
          echo "BODYTRACE_SIGNING_FILE=$signing_file" >> "$GITHUB_ENV"
          echo "BODYTRACE_STORE_PASSWORD=bodytrace-public-signing-v1" >> "$GITHUB_ENV"
          echo "BODYTRACE_KEY_ALIAS=bodytrace" >> "$GITHUB_ENV"
          echo "BODYTRACE_KEY_PASSWORD=bodytrace-public-signing-v1" >> "$GITHUB_ENV"
      - name: Assemble signed Release APK
        run: gradle --no-daemon -PappBuildNumber="$GITHUB_RUN_NUMBER" :app:assembleRelease
      - name: Verify APK signature and app version
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | head -n 3
          cp app/build/outputs/apk/release/app-release.apk BodyTrace-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BodyTrace-Stable-Release-APK
          path: BodyTrace-release.apk
          if-no-files-found: error
      - name: Publish permanent-signature APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.2.$GITHUB_RUN_NUMBER"
          gh release create "$tag" "BodyTrace-release.apk#Fixed-signature Android APK" \
            --target "$GITHUB_SHA" \
            --title "BodyTrace $tag (Release)" \
            --notes "Personal-only app. The fixed public Android signing identity is intentionally stored in signing/bodytrace-release.p12.b64. Future builds use the same signing certificate." \
            --latest
          echo "https://github.com/$GH_REPO/releases/latest/download/BodyTrace-release.apk"
