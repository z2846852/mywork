name: Build BodyTrace Android APK (fast)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/build_ui_bundle.py'
      - 'scripts/test_workout_date_heat.js'
      - 'scripts/apk_delta.py'
      - 'scripts/build_pronunciation_lexicon.py'
      - 'scripts/fetch_yamnet.sh'
      - 'scripts/fetch_ipa_samples.py'
      - 'scripts/fetch_sherpa_aar.sh'
      - 'signing/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bodytrace-android-main
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify feedback policy and JavaScript syntax
        run: |
          set -euo pipefail
          node --check app/src/main/assets/sleep.js
          mkdir -p /tmp/feedback-tests
          javac -d /tmp/feedback-tests app/src/main/java/com/z2846852/bodytrace/FeedbackPolicy.java scripts/FeedbackPolicyTest.java
          java -cp /tmp/feedback-tests com.z2846852.bodytrace.FeedbackPolicyTest
      - name: Validate Beijing date rollover, workout edits and heatmap
        run: node scripts/test_workout_date_heat.js
      - name: Build pinned offline American IPA and English-Chinese dictionary
        run: |
          set -euo pipefail
          python3 scripts/build_pronunciation_lexicon.py
          test -s app/src/main/assets/en_pronunciation_zh.tsv.gzdata
          python3 - <<'PY'
          import gzip,pathlib
          f=pathlib.Path("app/src/main/assets/en_pronunciation_zh.tsv.gzdata")
          with gzip.open(f,"rt",encoding="utf-8") as source:
              lines=source.read().splitlines()
          assert len(lines)>10000, f"Unusually small lexicon: {len(lines)}"
          words={s.split("\t",1)[0] for s in lines}
          assert {"think","can't","ship","hello"}.issubset(words)
          print("Verified embedded bilingual IPA lexicon",len(lines),"entries",f.stat().st_size,"bytes")
          PY
      - name: Fetch and SHA256-verify offline YAMNet model
        run: bash scripts/fetch_yamnet.sh
      - name: Reuse previously verified human IPA Ogg audio from latest signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-previous" app/src/main/assets/ipa_audio
          if gh release download --pattern 'BodyTrace-release.apk' \
            --dir "$RUNNER_TEMP/ipa-previous" --clobber; then
            for name in retroflex_sh.ogg central_i.ogg; do
              target="app/src/main/assets/ipa_audio/$name"
              unzip -p "$RUNNER_TEMP/ipa-previous/BodyTrace-release.apk" \
                "assets/ipa_audio/$name" > "$target" || rm -f "$target"
              if [[ -f "$target" && "$(head -c 4 "$target")" != "OggS" ]]; then
                rm -f "$target"
              fi
            done
          fi
      - name: Bundle pinned human IPA samples (Wikimedia Commons, CC BY-SA)
        run: |
          python3 scripts/fetch_ipa_samples.py
          test -s app/src/main/assets/ipa_audio/retroflex_sh.ogg
          test -s app/src/main/assets/ipa_audio/central_i.ogg
      - name: Generate verified UI-only bundle
        run: |
          python3 scripts/build_ui_bundle.py --version "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
          cp build/ui_bundle.zip BodyTrace-ui.zip
      - name: Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load fixed public signing identity
        shell: bash
        run: |
          set -euo pipefail
          signing_file="$RUNNER_TEMP/bodytrace-release.p12"
          test -s signing/bodytrace-release.p12.b64
          base64 --decode signing/bodytrace-release.p12.b64 > "$signing_file"
          keytool -list -storetype PKCS12 -keystore "$signing_file" \
            -storepass "bodytrace-public-signing-v1" -alias bodytrace >/dev/null
          echo "BODYTRACE_SIGNING_FILE=$signing_file" >> "$GITHUB_ENV"
          echo "BODYTRACE_STORE_PASSWORD=bodytrace-public-signing-v1" >> "$GITHUB_ENV"
          echo "BODYTRACE_KEY_ALIAS=bodytrace" >> "$GITHUB_ENV"
          echo "BODYTRACE_KEY_PASSWORD=bodytrace-public-signing-v1" >> "$GITHUB_ENV"
      - name: Fetch SHA256-pinned sherpa-onnx Android runtime (model weights excluded)
        run: bash scripts/fetch_sherpa_aar.sh
      - name: Assemble signed Release APK
        run: gradle --no-daemon -PappBuildNumber="$GITHUB_RUN_NUMBER" :app:assembleRelease
      - name: Verify APK signature and app version
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | head -n 3
          cp app/build/outputs/apk/release/app-release.apk BodyTrace-release.apk
      - name: Verify signed APK embeds real offline IPA audio
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("BodyTrace-release.apk") as apk:
              names=set(apk.namelist())
              required={"s.mp3","th.mp3","i.mp3","ng.mp3",
                        "retroflex_sh.ogg","central_i.ogg"}
              assert all("assets/ipa_audio/"+x in names for x in required), (
                  "Missing actual recorded phonemes in signed APK")
              print("Real phoneme assets verified in APK")
          PY
      - name: Verify signed APK embeds the bilingual pronunciation dictionary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, io, zipfile
          apk = "app/build/outputs/apk/release/app-release.apk"
          asset = "assets/en_pronunciation_zh.tsv.gzdata"
          with zipfile.ZipFile(apk) as package:
              assert asset in package.namelist(), (
                  f"Missing {asset} from built APK; refusing to publish broken release")
              with gzip.open(io.BytesIO(package.read(asset)), "rt", encoding="utf-8") as source:
                  rows = source.read().splitlines()
          assert len(rows) >= 10000, f"Incomplete APK dictionary: {len(rows)} entries"
          words = {line.partition(chr(9))[0] for line in rows}
          assert {"think", "can't", "ship", "hello"} <= words, "Required entries absent"
          print(f"Verified signed APK contains offline dictionary: {len(rows)} entries")
          PY
      - name: Build direct APK patches from recent 10 signed Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/apk_delta.py --target BodyTrace-release.apk \
            --version "$GITHUB_RUN_NUMBER" --output release-updates --max-versions 10
      - uses: actions/upload-artifact@v4
        with:
          name: BodyTrace-Stable-Release-APK
          path: BodyTrace-release.apk
          if-no-files-found: error
      - name: Publish permanent-signature APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.2.$GITHUB_RUN_NUMBER"
          shopt -s nullglob
          patch_assets=(release-updates/*.btpatch)
          previous_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          {
            echo "### $tag 的实际 Git 提交"
            if [[ "$previous_tag" =~ ^v0\.2\.[0-9]+$ ]]; then
              echo
              echo "比较范围：$previous_tag → $tag"
              echo
              if gh api "repos/$GH_REPO/compare/${previous_tag}...${GITHUB_SHA}" \
                --jq '.commits[].commit.message | split("\n")[0] | "- " + .' \
                > release-commit-lines.txt; then
                if [[ -s release-commit-lines.txt ]]; then
                  cat release-commit-lines.txt
                else
                  echo "- 该区间没有可列出的提交。"
                fi
              else
                echo "- 无法生成提交列表，请查看 GitHub Compare。"
              fi
              echo
              echo "完整差异：https://github.com/$GH_REPO/compare/$previous_tag...$tag"
            else
              echo
              echo "首次 Release；后续版本将逐版记录实际 Git 提交。"
            fi
            echo
            echo "安装资源：签名 APK、可选界面小包，以及旧版本的直接差分补丁。"
          } > release-notes.md
          gh release create "$tag" \
            "BodyTrace-release.apk#Fixed-signature Android APK" \
            "BodyTrace-ui.zip#Optional small UI-only update" \
            "release-updates/BodyTrace-updates.json#Cross-version APK delta manifest" \
            "${patch_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "BodyTrace $tag (Release)" \
            --notes-file release-notes.md \
            --latest
          echo "https://github.com/$GH_REPO/releases/latest/download/BodyTrace-release.apk"

      - name: Record latest successfully published APK in build-status.json
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Runs only after gh release create succeeds. This file is the
          # durable record of the last published build, not the latest commit.
          version="v0.2.$GITHUB_RUN_NUMBER"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          status_json="$(jq -n \
            --arg version "$version" \
            --arg sha "$GITHUB_SHA" \
            --arg published_at "$published_at" \
            --arg run_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            --arg release_url "https://github.com/$GH_REPO/releases/tag/$version" \
            --arg apk_url "https://github.com/$GH_REPO/releases/download/$version/BodyTrace-release.apk" \
            --argjson run_number "$GITHUB_RUN_NUMBER" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '{schema_version:1,status:"published",version:$version,
              version_code:$run_number,run_number:$run_number,run_id:$run_id,
              source_commit:$sha,published_at:$published_at,
              actions_url:$run_url,release_url:$release_url,
              apk_download_url:$apk_url}')"
          encoded="$(printf '%s\n' "$status_json" | base64 -w0)"
          # The main branch may advance while the APK is building. Use the
          # current content SHA and retry optimistic conflicts.
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "repos/$GH_REPO/contents/build-status.json?ref=main" \
              --jq '.sha' 2>/dev/null || true)"
            jq -n --arg body "$encoded" --arg sha "$current_sha" \
              --arg version "$version" \
              '{message:("chore: record successful APK "+$version),
                content:$body,branch:"main"} +
                (if $sha == "" then {} else {sha:$sha} end)' \
              > "$RUNNER_TEMP/build-status-request.json"
            if gh api --method PUT "repos/$GH_REPO/contents/build-status.json" \
                --input "$RUNNER_TEMP/build-status-request.json" >/dev/null; then
              echo "Recorded $version ($GITHUB_SHA) in build-status.json"
              exit 0
            fi
            echo "Status write attempt $attempt failed; retrying latest main SHA"
            sleep 3
          done
          echo "::error::Release $version published but build-status.json could not be updated."
          exit 1
