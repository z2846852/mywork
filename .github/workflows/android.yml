name: Build BodyTrace Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bodytrace-android-main
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and package debug APK
        run: gradle --no-daemon -PappBuildNumber="$GITHUB_RUN_NUMBER" :app:assembleDebug
      - name: Inspect APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 3
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BodyTrace-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BodyTrace-Android-debug-APK
          path: BodyTrace-debug.apk
          if-no-files-found: error
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.1.$GITHUB_RUN_NUMBER"
          gh release create "$tag" "BodyTrace-debug.apk#Android APK" --target "$GITHUB_SHA" \
            --title "BodyTrace $tag (test)" --notes "Personal test build. Uses ephemeral Android debug signing; reinstall may require uninstall and clearing local token. Do not embed GitHub tokens in source." --latest
          echo "https://github.com/$GH_REPO/releases/latest/download/BodyTrace-debug.apk"
