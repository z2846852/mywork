name: Preview Cartoon Body Page
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/features.css'
      - 'app/src/main/assets/features.js'
      - 'app/src/main/assets/avatar_cartoon.svg'
      - 'scripts/preview_cartoon.cjs'
      - '.github/workflows/preview-cartoon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts --no-fund --no-audit playwright@1.56.1
          npx --no-install playwright install chromium
      - name: Render cartoon avatar with sample measurements
        run: node scripts/preview_cartoon.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BodyTrace-Cartoon-Preview
          path: bodytrace-*-preview.png
          if-no-files-found: warn
