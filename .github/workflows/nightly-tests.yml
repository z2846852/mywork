name: Full BodyTrace regression tests (nightly)

on:
  schedule:
    # GitHub cron runs in UTC; 19:00 UTC = 03:00 Asia/Shanghai.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodytrace-full-regression-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inferred recording start timestamps (plain Java)
        run: |
          mkdir -p "$RUNNER_TEMP/bodytrace-timestamp-test"
          javac -d "$RUNNER_TEMP/bodytrace-timestamp-test" \
            app/src/main/java/com/z2846852/bodytrace/SleepRecordingTime.java \
            scripts/java_tests/com/z2846852/bodytrace/SleepRecordingTimeTest.java
          java -cp "$RUNNER_TEMP/bodytrace-timestamp-test" \
            com.z2846852.bodytrace.SleepRecordingTimeTest
      - name: Validate APK binary delta roundtrip (Python producer / Java consumer)
        run: |
          set -euo pipefail
          python3 scripts/test_apk_delta.py
          mkdir -p "$RUNNER_TEMP/bodytrace-delta-test"
          javac -d "$RUNNER_TEMP/bodytrace-delta-test" \
            app/src/main/java/com/z2846852/bodytrace/ApkDeltaPatch.java \
            scripts/java_tests/com/z2846852/bodytrace/ApkDeltaPatchTest.java
          java -cp "$RUNNER_TEMP/bodytrace-delta-test" \
            com.z2846852.bodytrace.ApkDeltaPatchTest
      - name: Validate group-rest countdown and record workflow
        run: node scripts/test_rest_timer.js
      - name: Validate sleep status UI and startup recovery integration
        run: |
          set -euo pipefail
          node --check app/src/main/assets/sleep.js
          node scripts/test_sleep_startup.js
      - name: Validate phone activity sleep inference (all retained event dates)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bodytrace-phone-sleep"
          javac -d "$RUNNER_TEMP/bodytrace-phone-sleep" \
            app/src/main/java/com/z2846852/bodytrace/PhoneSleepInference.java \
            scripts/java_tests/com/z2846852/bodytrace/PhoneSleepInferenceTest.java
          java -cp "$RUNNER_TEMP/bodytrace-phone-sleep" \
            com.z2846852.bodytrace.PhoneSleepInferenceTest
      - name: Validate live pitch and phonetic acoustic probes (plain Java)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bodytrace-voice-lab"
          javac -d "$RUNNER_TEMP/bodytrace-voice-lab" \
            app/src/main/java/com/z2846852/bodytrace/PitchDetector.java \
            app/src/main/java/com/z2846852/bodytrace/VowelSpectrum.java \
            app/src/main/java/com/z2846852/bodytrace/PhonemeProbe.java \
            scripts/java_tests/com/z2846852/bodytrace/VoiceLabDspTest.java
          java -cp "$RUNNER_TEMP/bodytrace-voice-lab" \
            com.z2846852.bodytrace.VoiceLabDspTest
      - name: Validate English IPA-to-word and Chinese meaning lookup (offline fixtures)
        run: |
          set -euo pipefail
          python3 scripts/test_pronunciation_lexicon.py
          mkdir -p "$RUNNER_TEMP/bodytrace-lexicon"
          javac -d "$RUNNER_TEMP/bodytrace-lexicon" \
            app/src/main/java/com/z2846852/bodytrace/PhoneticLexicon.java \
            scripts/java_tests/com/z2846852/bodytrace/PhoneticLexiconTest.java
          java -cp "$RUNNER_TEMP/bodytrace-lexicon" \
            com.z2846852.bodytrace.PhoneticLexiconTest
      - name: Validate cartoon body page, JSON UI and avatar persistence
        run: node scripts/test_ui.js
      - name: Inspect actual YAMNet model tensor shapes
        run: |
          bash scripts/fetch_yamnet.sh
          python3 scripts/inspect_yamnet.py
      - name: Verify optional UI-only update bundle
        run: |
          python3 scripts/build_ui_bundle.py --version "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
          python3 scripts/test_ui_bundle.py
